 163M100 200L790 660\" stroke=\"#274156\" stroke-dasharray=\"3 10\"/></g></svg></div><div class=\"cover-bottom\"><span>科学智能原理与实践</span><span>北京邮电大学 / 2026.09.22</span></div>","type":"cover"},{"chapter":"选题参考","title":"参考方向与推荐平台","body":"<div class=\"reference-platform-stack\"><section class=\"reference-area\"><h3>参考方向</h3><div class=\"horizontal-domain-grid\"><div class=\"horizontal-domain\"><strong>AI4通信</strong><span>信道分析与网络优化</span></div><div class=\"horizontal-domain\"><strong>AI4数学</strong><span>问题求解与验证</span></div><div class=\"horizontal-domain\"><strong>AI4安全</strong><span>协议分析与验证</span></div><div class=\"horizontal-domain\"><strong>AI4医学</strong><span>医学数据分析</span></div><div class=\"horizontal-domain\"><strong>AI4生物</strong><span>生物数据解读</span></div><div class=\"horizontal-domain\"><strong>AI4蛋白质</strong><span>结构与功能分析</span></div><div class=\"horizontal-domain\"><strong>AI4材料</strong><span>材料性质预测</span></div><div class=\"horizontal-domain\"><strong>AI4芯片</strong><span>设计与仿真</span></div><div class=\"horizontal-domain\"><strong>AI4气象</strong><span>气象分析与预测</span></div><div class=\"horizontal-domain\"><strong>AI4物理</strong><span>实验流程与结果复核</span></div></div><p class=\"direction-note\">以上方向仅供参考，同学们可以自主寻找自己感兴趣的方向，也可跨方向组合；选题价值取决于科学问题与验证设计。</p></section><section class=\"platform-area\"><div class=\"platform-heading\"><h3>推荐平台</h3><p>同学们也可以根据作业需要使用其他平台。</p></div><div class=\"platform-row\"><div class=\"platform-card teal\"><h4>书生·端砚</h4><p>用于科研问题理解、资料查找、研究分析和结果整理，支持端到端的 AI4S 实践任务。</p></div><div class=\"platform-card blue\"><h4>玻尔</h4><p>用于科学计算与 AI4S 实践，结合平台工具、计算资源和案例完成任务执行与结果验证。</p></div><div class=\"platform-card amber\"><h4>磐石</h4><p>用于科学智能任务实践，结合模型和工具开展问题分析、流程执行与成果整理。</p></div></div></section></div>","type":""},{"chapter":"作业目录","title":"三种作业类型","type":"contents","body":"<div class=\"assignment-list\"><a class=\"assignment\" href=\"#4\" data-goto=\"3\"><div class=\"assignment-name\"><span class=\"mono\">01</span><h3>AI4S 论文报告</h3><p>用好平台工具，完成一次 AI4S 论文报告</p></div><div><h4>主要任务</h4><p>围绕一个科研问题，使用端砚等平台完成问题理解、资料查找、研究分析、结果形成与验证。</p><p class=\"practice\"><b>实践方向：</b>完成一次论文研究全流程</p></div><div><h4>输出成果</h4><p>完整的科研任务作业及过程记录，包括实践报告、运行记录与验证证据。</p></div></a><a class=\"assignment\" href=\"#10\" data-goto=\"9\"><div class=\"assignment-name\"><span class=\"mono\">02</span><h3>科研 Skill 开发</h3><p>做一个领域 Skill</p></div><div><h4>主要任务</h4><p>从个人或课题组的高频科研流程中选择一个场景，完成流程拆解、Skill 构建和测试验证。</p><p class=\"practice\"><b>实践方向：</b>重复性科研经验的 Skill 设计</p></div><div><h4>输出成果</h4><p>可运行的科研 Skill、测试记录和实践报告。</p></div></a><a class=\"assignment\" href=\"#13\" data-goto=\"12\"><div class=\"assignment-name\"><span class=\"mono\">03</span><h3>AI4S 案例复现</h3><p>复现一个 AI4S 案例</p></div><div><h4>主要任务</h4><p>基于给定的科学问题、数据和环境，使用端砚及科学发现平台完成实验复现，并对照验证结果。</p><p class=\"practice\"><b>实践方向：</b>基于 ERA5 的高空气象分析方案复现</p></div><div><h4>输出成果</h4><p>复现报告、运行代码或工程文件，以及结果记录。</p></div></a></div>"},{"chapter":"01 / AI4S 论文报告","title":"AI4S 论文报告：任务与要求","body":"<p class=\"page-brief\">选择一个感兴趣的科学方向，使用书生·端砚、玻尔、磐石等平台，形成有证据支持、能够复现的实践成果。</p><div class=\"dense-grid\"><div class=\"dense-card\"><h3>作业目标</h3><ul><li>把兴趣转化为<strong>可验证的科学问题</strong></li><li>完成文献、数据、执行、验证闭环</li><li>解释结论可信度与适用边界</li></ul></div><div class=\"dense-card\"><h3>核心任务</h3><ul><li>文献检索与关键原文核查</li><li>数据准备与质量说明</li><li>调用平台工具完成一次端到端任务</li><li>用对照证据验证关键输出</li></ul></div><div class=\"dense-card\"><h3>提交材料</h3><ul><li class=\"deliverable\">实践作品或可运行工作流</li><li class=\"deliverable\">创新实践报告</li><li class=\"deliverable\">关键运行记录与结果截图</li><li class=\"deliverable\">小组分工与AI使用说明</li></ul></div><div class=\"dense-card\"><h3>完成边界</h3><ul><li>允许复用现有数据、模型和工具</li><li>不要求从零训练模型</li><li>不要求取得原创科学发现</li><li>不得虚构数据、结果或引用</li></ul></div></div><div class=\"metric-row\"><div class=\"metric\"><strong>3—5人</strong><span>建议小组规模</span></div><div class=\"metric\"><strong>1个</strong><span>贯穿始终的科学问题</span></div><div class=\"metric\"><strong>1次+</strong><span>完整平台执行过程</span></div><div class=\"metric\"><strong>2类+</strong><span>相互独立的验证证据</span></div></div>","type":" report-section"},{"chapter":"01 / AI4S 论文报告","title":"六步实践路径","body":"<p class=\"page-brief\">围绕同一个科学问题持续推进；每一步只保留课程作业需要完成的核心动作和交付证据。</p><div class=\"flow\"><div class=\"flow-step\"><span class=\"mono\">01</span><h3>选择方向</h3><p><b>明确：</b>研究对象、输入输出、完成判据<br><b>交付：</b>选题说明、资源与风险清单</p></div><div class=\"flow-step\"><span class=\"mono\">02</span><h3>文献调研</h3><p><b>完成：</b>关键词检索、方法比较、原文核查<br><b>交付：</b>结构化文献表与核心阅读卡</p></div><div class=\"flow-step\"><span class=\"mono\">03</span><h3>整理数据</h3><p><b>记录：</b>来源、版本、字段、单位与许可<br><b>交付：</b>数据字典、质量统计与处理记录</p></div><div class=\"flow-step\"><span class=\"mono\">04</span><h3>执行任务</h3><p><b>完成：</b>至少一次端到端平台运行<br><b>智能体：</b>解决2—3类同领域问题<br><b>交付：</b>作品链接、参数、日志与代表性输出</p></div><div class=\"flow-step\"><span class=\"mono\">05</span><h3>验证改进</h3><p><b>验证：</b>原文、复算、基准或交叉工具<br><b>交付：</b>对照表、错误案例与适用边界</p></div><div class=\"flow-step\"><span class=\"mono\">06</span><h3>展示成果</h3><p><b>提交：</b>实践作品、报告、复现材料<br><b>展示：</b>问题—执行—验证完整链路<br><b>规范：</b>分工、引用、许可与AI使用说明</p></div></div><div class=\"metric-row\"><div class=\"metric\"><strong>1个</strong><span>贯穿始终的科学问题</span></div><div class=\"metric\"><strong>1条</strong><span>可复现端到端工作流</span></div><div class=\"metric\"><strong>2种+</strong><span>独立验证证据</span></div><div class=\"metric\"><strong>1套</strong><span>作品、报告与过程材料</span></div></div>","type":" report-section"},{"chapter":"01 / AI4S 论文报告","title":"本科生与研究生要求","body":"<table class=\"compare\"><thead><tr><th>考核方面</th><th>本科生</th><th>研究生</th></tr></thead><tbody><tr><td>科学问题与选题</td><td>选择明确、可完成的任务，可复现已有研究或验证已知结论。</td><td>基于文献提出具有一定创新性的问题，明确与已有工作的区别。</td></tr><tr><td>文献调研</td><td>理解基本方法和主要结论，核查关键文献与引用。</td><td>比较已有工作，总结不足、边界或尚未解决的问题。</td></tr><tr><td>平台实践</td><td>完整经历数据准备、工具使用、任务执行和结果验证。</td><td>围绕已有不足提出方法、数据处理、工作流或验证设计的改进。</td></tr><tr><td>结果验证</td><td>说明任务是否完成、结果是否可信及其局限。</td><td>设置与改进目标对应的对照，分析优势、代价及适用条件。</td></tr><tr><td>报告表达</td><td>清楚说明做了什么、怎样做、结果如何及不足。</td><td>形成不足、改进、证据、优势与局限的完整论证。</td></tr></tbody></table>","type":" report-section"},{"chapter":"01 / AI4S 论文报告","title":"作业成绩构成","body":"<div class=\"score-head\"><div><strong>30%</strong><span>选题与问题形成</span></div><div><strong>50%</strong><span>平台实践与作品</span></div><div><strong>10%</strong><span>创新实践报告</span></div><div><strong>10%</strong><span>个人贡献</span></div></div><table class=\"score-table\"><thead><tr><th>评分项</th><th>核心指标</th><th>优秀表现</th><th>主要证据</th></tr></thead><tbody><tr><td>选题与问题形成</td><td>问题清晰可检验；数据与平台资源可获得；文献真正支持选题。</td><td>8篇以上有效文献，比较两种以上路线，问题—数据—工具衔接完整。</td><td>选题说明、结构化文献表、资源清单与执行计划。</td></tr><tr><td>平台实践与作品</td><td>完成真实端到端工作流；作品回答主要问题；结果经过验证并可复现。</td><td>两种以上独立验证；有错误分析和有效改进；过程材料完整。</td><td>作品链接、运行日志、参数、关键截图、验证表与前后对照。</td></tr><tr><td>创新实践报告</td><td>结构完整；结论由数据与证据支持；说明局限及AI使用方式。</td><td>图表准确，事实与推断区分清楚，形成完整证据链。</td><td>实践报告、图表、证据链接、引用与AI使用声明。</td></tr><tr><td>个人贡献</td><td>分工明确、贡献可查；能够解释本人工作与项目结论。</td><td>承担关键模块，解决实际问题，能够回答数据、方法与验证追问。</td><td>分工表、版本或过程记录、个人陈述与现场问答。</td></tr></tbody></table><div class=\"takeaway\">合格底线：问题可完成、至少一次成功运行、关键结果有验证、材料可检查、个人贡献可说明。</div>","type":" report-section"},{"chapter":"01 / AI4S 论文报告","title":"学完本课程可以参加的典型赛事","body":"<div class=\"pathway\"><span>① 课程学习</span><i>→</i><span>② 项目孵化</span><i>→</i><span>③ 赛题匹配</span><i>→</i><span>④ 作品打磨</span><i>→</i><span>⑤ 正式参赛</span></div><div class=\"dense-grid\"><div class=\"dense-card\"><h3>衔接目标</h3><ul><li>把课程作业继续打磨为竞赛作品</li><li>围绕真实数据、问题和验证结果迭代</li><li>形成可演示、可复现、可答辩的成果</li></ul></div><div class=\"dense-card\"><h3>赛事板块</h3><ul><li>AI4S与科学智能专题赛事</li><li>研究生创新实践系列大赛</li><li>综合实践与企业命题赛事</li><li>国际顶会竞赛与挑战赛</li></ul></div><div class=\"dense-card\"><h3>重点能力</h3><ul><li>AI-ready数据构建与质量控制</li><li>多模态科学信息理解</li><li>Agent、RAG与工具链调用</li><li>科学问题建模、求解与实验验证</li></ul></div><div class=\"dense-card\"><h3>参赛准备</h3><ul><li>核对当年赛题、时间和报名资格</li><li>补充基准、消融、误差和边界分析</li><li>整理代码、数据说明、演示与答辩材料</li><li>课程作业参赛加分仍以课程规定为准</li></ul></div></div>","type":" report-section"},{"chapter":"01 / AI4S 论文报告","title":"典型赛事与官方网址","body":"<p class=\"page-brief\">点击赛事卡片可打开官方网站或官方赛事页面；具体赛题、时间与报名要求以当年通知为准。</p><div class=\"competition-grid\"><a class=\"competition\" href=\"https://ai4scompetition.intern-ai.org.cn/\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">01</span><h3>上海AI实验室 · 书生国智科探挑战赛</h3><p>聚焦生命、物质、地球、量子等科学赛道，适合多模态科学数据理解与 AI4S 建模任务。</p><div class=\"url\">https://ai4scompetition.intern-ai.org.cn/</div></a><a class=\"competition\" href=\"https://www.bohrium.com/competitions\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">02</span><h3>深势科技 · AI4S Cup</h3><p>依托玻尔赛事中心，围绕分子、材料、药物与科学计算等方向设置赛题。</p><div class=\"url\">https://www.bohrium.com/competitions</div></a><a class=\"competition\" href=\"https://panshi-ai4s.tashan.chat/projects\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">03</span><h3>磐石 · 科学智能科研比赛</h3><p>可关注科学智能、基础模型与产业科研任务，适合作为课程项目延伸与储备方向。</p><div class=\"url\">https://panshi-ai4s.tashan.chat/projects</div></a><a class=\"competition\" href=\"https://bigdata.10086.cn/honghu/hhweb/#/wutongcup/fifth?lang=zh\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">04</span><h3>中国移动“梧桐杯”数智创新大赛</h3><p>面向数智创新与工程应用的综合赛事，适合将课程项目整理为方案、原型与答辩材料参赛。</p><div class=\"url\">https://bigdata.10086.cn/honghu/hhweb/#/wutongcup/fifth?lang=zh</div></a><a class=\"competition\" href=\"https://play.bohrium.com/\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">05</span><h3>Agentic Science Challenge</h3><p>强调科研智能体的问题理解、工具调用、代码执行与结果验证，与课程模块高度匹配。</p><div class=\"url\">https://play.bohrium.com/</div></a><a class=\"competition\" href=\"https://cpipc.acge.org.cn/cw/hp/2c9088a5696cbf370169a3f8101510bd\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">06</span><h3>中国研究生人工智能创新大赛</h3><p>中国研究生创新实践系列大赛中的 AI 核心赛事，适合算法、模型、系统与应用创新作品。</p><div class=\"url\">https://cpipc.acge.org.cn/cw/hp/2c9088a5696cbf370169a3f8101510bd</div></a><a class=\"competition\" href=\"https://cpipc.acge.org.cn/cw/hp/1\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">07</span><h3>中国研究生智慧城市技术与创意设计大赛</h3><p>聚焦城市计算、时空数据、智能感知与创意应用，适合数据工程与综合项目成果参赛。</p><div class=\"url\">https://cpipc.acge.org.cn/cw/hp/1</div></a><a class=\"competition\" href=\"https://cpipc.acge.org.cn/cw/hp/2c9088a5696cbf370169a3f8934810be\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">08</span><h3>中国研究生机器人创新设计大赛</h3><p>适合智能机器人、感知控制、系统集成与具身智能方向作品。</p><div class=\"url\">https://cpipc.acge.org.cn/cw/hp/2c9088a5696cbf370169a3f8934810be</div></a><a class=\"competition\" href=\"https://blog.neurips.cc/2026/07/28/neurips-2026-competitions-announced/\" target=\"_blank\" rel=\"noopener\"><span class=\"no\">09</span><h3>NeurIPS Competition Track</h3><p>国际顶会竞赛入口，可重点关注 Scientific AI、Physics、Engineering 等 AI4S 相关赛题。</p><div class=\"url\">https://blog.neurips.cc/2026/07/28/neurips-2026-competitions-announced/</div></a></div>","type":" report-section"},{"chapter":"02 / 科研 Skill 开发","title":"完成一个可运行的科研 Skill","body":"<p class=\"page-brief\">选择一个稳定、高频、可结构化的科研或工程任务，完成 Skill 的设计、实现与真实案例验证。</p><div class=\"dense-grid\"><div class=\"dense-card\"><h3>选题要求</h3><ul><li>任务真实且能够反复执行</li><li>具有稳定 SOP 与明确规则</li><li>输入输出可以结构化</li><li>适合在课程周期内完成</li></ul></div><div class=\"dense-card\"><h3>开发要求</h3><ul><li>建立规范的 Skill 目录</li><li>编写可执行的 SKILL.md</li><li>准备领域知识、脚本与模板</li><li>维护版本和变更记录</li></ul></div><div class=\"dense-card\"><h3>验证要求</h3><ul><li>使用真实历史案例运行</li><li>与人工或公开结果比较</li><li>覆盖异常输入和边缘规则</li><li>保留可复查的测试记录</li></ul></div><div class=\"dense-card\"><h3>完成边界</h3><ul><li>作业由个人独立完成</li><li>提交材料完整且可以检查</li><li>关键过程和结果均有记录</li><li>不得虚构数据、结果或来源</li></ul></div></div><div class=\"metric-row\"><div class=\"metric\"><strong>1人</strong><span>个人独立完成</span></div><div class=\"metric\"><strong>1项</strong><span>明确且稳定的任务</span></div><div class=\"metric\"><strong>1套</strong><span>完整 Skill 目录</span></div><div class=\"metric\"><strong>1例+</strong><span>真实历史案例验证</span></div></div>","type":" skill-section"},{"chapter":"02 / 科研 Skill 开发","title":"六步实践路径","body":"<p class=\"page-brief\">从具体科研或工程任务出发，逐步完成 Skill 设计、实现与验证，并根据测试结果调整规则、脚本和资源，记录关键修改。</p><div class=\"flow\"><div class=\"flow-step\"><span class=\"mono\">01</span><h3>明确问题</h3><p><b>明确：</b>使用者、输入、输出、边界与验收标准<br><b>论证：</b>稳定 SOP、明确规则、高频重复、结构化输出</p></div><div class=\"flow-step\"><span class=\"mono\">02</span><h3>创建目录</h3><p><b>建立：</b>标准 Skill 文件夹结构<br><b>记录：</b>名称、描述、版本、作者、环境与依赖</p></div><div class=\"flow-step\"><span class=\"mono\">03</span><h3>编写 SKILL.md</h3><p><b>定义：</b>触发条件、知识路由、执行步骤与输出契约<br><b>转化：</b>把隐性经验写成可执行规则</p></div><div class=\"flow-step\"><span class=\"mono\">04</span><h3>准备资源</h3><p><b>导入：</b>领域规范、公开数据与正反案例<br><b>制作：</b>参数化脚本和标准交付模板</p></div><div class=\"flow-step\"><span class=\"mono\">05</span><h3>验证 Skill</h3><p><b>运行：</b>真实历史案例与异常输入<br><b>对照：</b>人工或公开结果并记录偏差</p></div><div class=\"flow-step\"><span class=\"mono\">06</span><h3>整理展示</h3><p><b>提交：</b>完整 Skill 目录、测试记录和实践报告<br><b>说明：</b>成果边界、版本状态与使用方法</p></div></div><div class=\"metric-row\"><div class=\"metric\"><strong>1项</strong><span>适合 Skill 化的真实任务</span></div><div class=\"metric\"><strong>1套</strong><span>标准 Skill 目录与资源</span></div><div class=\"metric\"><strong>1例+</strong><span>真实历史案例验证</span></div><div class=\"metric\"><strong>1份</strong><span>实践报告与测试记录</span></div></div>","type":" skill-section"},{"chapter":"02 / 科研 Skill 开发","title":"作业成绩构成","body":"<div class=\"score-head\"><div><strong>20%</strong><span>问题定义与选题论证</span></div><div><strong>50%</strong><span>Skill目录与规则设计</span></div><div><strong>20%</strong><span>真实案例验证与测试留痕</span></div><div><strong>10%</strong><span>实践报告</span></div></div><table class=\"score-table\"><thead><tr><th>评分项</th><th>核心指标</th><th>优秀表现</th><th>主要证据</th></tr></thead><tbody><tr><td>问题定义与选题论证</td><td>任务真实，使用者、边界、输入输出和验收标准明确。</td><td>选题满足稳定 SOP、明确规则、高频重复和结构化输出四项特征。</td><td>选题说明、任务边界、输入输出与验收标准。</td></tr><tr><td>Skill目录与规则设计</td><td>目录结构规范，SKILL.md 触发准确、步骤可执行、判断有标准。</td><td>规则、脚本、资源和模板分工合理，版本与变更记录完整。</td><td>Skill目录、SKILL.md、脚本、模板及版本日志。</td></tr><tr><td>真实案例验证与测试留痕</td><td>真实案例跑通，并与人工复算或公开结果完成对照。</td><td>偏差解释清楚，异常输入和关键边缘规则覆盖充分。</td><td>运行记录、输出文件、对照结果与测试记录。</td></tr><tr><td>实践报告</td><td>如实记录 Skill 开发和验证过程，内容与实际成果一致。</td><td>结论有证据支持，局限、引用和 AI 使用说明完整。</td><td>实践报告、图表、引用与成果链接。</td></tr></tbody></table><div class=\"takeaway\">合格底线：选题边界清楚，Skill 能够被识别并运行，至少一个真实案例完成验证，测试记录可以检查，实践报告与实际成果一致。</div>","type":" skill-section"},{"chapter":"03 / AI4S 案例复现","title":"AI4S 案例复现：任务与要求","body":"<p class=\"page-brief\">选择一个具有明确科学问题的AI4S案例，使用书生·端砚、玻尔、磐石或其他科学发现平台，完成复现并对照验证。</p><div class=\"dense-grid\"><div class=\"dense-card\"><h3>作业目标</h3><ul><li>理解案例的科学问题与主要方法</li><li>明确拟复现的图表、指标或结论</li><li>形成过程可追溯、结果可核查的复现成果</li></ul></div><div class=\"dense-card\"><h3>核心任务</h3><ul><li>理解案例并制定实验方案</li><li>准备数据与配置运行环境</li><li>执行代码或平台工作流</li><li>对照原案例验证结果、分析差异</li></ul></div><div class=\"dense-card\"><h3>提交材料</h3><ul><li class=\"deliverable\">案例复现报告</li><li class=\"deliverable\">产出结果</li><li class=\"deliverable\">完整代码或工程文件</li></ul></div><div class=\"dense-card\"><h3>完成边界</h3><ul><li>可复现一个完整子任务</li><li>可复用现成数据、模型、代码和工具</li><li>允许AI辅助，须核查关键内容并说明</li><li>不能仅以代码运行成功作为完成标准</li></ul></div></div><div class=\"metric-row\"><div class=\"metric\"><strong>2–3人</strong><span>小组合作开展实践</span></div><div class=\"metric\"><strong>1个案例</strong><span>可选择其中完整子任务</span></div><div class=\"metric\"><strong>6步流程</strong><span>目标、设计、数据、执行、验证、展示</span></div><div class=\"metric\"><strong>3类材料</strong><span>报告、产出结果、代码或工程文件</span></div></div>","type":" case-section"},{"chapter":"03 / AI4S 案例复现","title":"六步复现流程","body":"<p class=\"page-brief\">围绕同一个案例开展复现，根据运行与验证结果调整环境、代码或参数。</p><div class=\"flow reproduction-flow\"><div class=\"flow-step\"><span class=\"mono\">01</span><h3>明确目标</h3><p><b>任务：</b>理解科学问题，确定复现对象与范围<br><b>记录：</b>案例来源、主要方法与复现目标</p></div><div class=\"flow-step\"><span class=\"mono\">02</span><h3>设计实验</h3><p><b>任务：</b>明确数据范围、分析方法与预期输出<br><b>记录：</b>实验方案、关键变量与校验标准</p></div><div class=\"flow-step\"><span class=\"mono\">03</span><h3>准备数据</h3><p><b>任务：</b>获取匹配数据，完成整理与质量检查<br><b>记录：</b>来源、版本、单位、使用条件与范围</p></div><div class=\"flow-step\"><span class=\"mono\">04</span><h3>执行复现</h3><p><b>任务：</b>配置环境，运行代码或平台工作流<br><b>记录：</b>关键输入、环境、参数、代码与日志</p></div><div class=\"flow-step\"><span class=\"mono\">05</span><h3>对照验证</h3><p><b>任务：</b>对照原案例结果，分析差异并修正<br><b>记录：</b>校验结果、差异原因与修正情况</p></div><div class=\"flow-step\"><span class=\"mono\">06</span><h3>展示成果</h3><p><b>任务：</b>说明复现结论、人工核查与局限<br><b>记录：</b>案例复现报告、产出结果、完整代码或工程文件</p></div></div><div class=\"takeaway\">依据校验标准判断复现目标是否达到，不能仅以“代码运行成功”作为完成标准。</div>","type":" case-section"},{"chapter":"03 / AI4S 案例复现","title":"作业成绩构成","body":"<div class=\"score-head rubric-head\"><div><strong>50%</strong><span>案例理解与方案设计</span></div><div><strong>30%</strong><span>平台实践与复现成果</span></div><div><strong>10%</strong><span>复现实践报告</span></div><div><strong>10%</strong><span>个人贡献与过程表现</span></div></div><table class=\"score-table rubric-table\"><colgroup><col style=\"width:15%\"><col style=\"width:25%\"><col style=\"width:36%\"><col style=\"width:24%\"></colgroup><thead><tr><th>评分项</th><th>核心指标</th><th>优秀表现</th><th>主要证据</th></tr></thead><tbody><tr><td>案例理解与<br>复现方案设计</td><td>目标具体，科学问题与方法理解准确；数据范围合理，环境与资源可行。</td><td>方案涵盖问题、数据、方法、预期输出和校验标准；关键变量含义清楚，结果对照方式明确。</td><td>案例出处、复现目标、实验方案、关键变量表与校验标准。</td></tr><tr><td>平台实践与<br>复现成果</td><td>数据准备、环境配置与执行完整；工作流可运行，结果对应复现目标。</td><td>依据标准逐项校验，对照原案例分析差异；必要时修正并记录结果，执行过程可追溯。</td><td>完整代码或工程文件、环境与参数配置、产出结果、日志及校验记录。</td></tr><tr><td>复现实践报告</td><td>结构完整、表达清晰；结论有运行结果支持，如实说明人工核查与局限。</td><td>目标、方案、执行和结果前后对应；说明目标达成情况、调整原因及影响，图表与结论一致。</td><td>案例复现报告、结果图表、差异分析、人工核查与AI辅助使用说明。</td></tr><tr><td>个人贡献与<br>过程表现</td><td>分工明确、贡献可查；能够解释本人工作与项目结论。</td><td>有效参与方案讨论、执行与迭代；能说明关键选择、问题排查依据及本人贡献。</td><td>小组分工、个人工作记录、问题排查与协作迭代记录。</td></tr></tbody></table><div class=\"takeaway\">考核重点：目标明确、方案可行、过程可追溯、结果有对照、结论有依据、个人贡献可说明。</div>","type":" case-section"}];
const stage=document.querySelector('#stage'),modal=document.querySelector('#modal');let current=0;
function render(initial=0){stage.innerHTML=SLIDES.map((s,i)=>`<section class="slide ${s.type} ${i===initial?'active':''}" data-slide="${i}"><header class="slide-header"><div class="eyebrow">${s.chapter}</div><h2 class="slide-title">${s.title}</h2></header><div class="slide-body">${s.body}</div><footer class="slide-footer">${i>=3?'<a class="return-toc" href="#3" data-goto="2" title="返回作业目录" aria-label="返回作业目录">⌂</a>':''}<span class="footer-brand">BUPT / AI FOR SCIENCE</span><span class="page-index">${String(i+1).padStart(2,'0')}</span></footer><div class="slide-progress" style="width:${(i+1)/SLIDES.length*100}%"></div></section>`).join('');document.querySelector('#chapter-track').innerHTML=SLIDES.map((s,i)=>`<button data-goto="${i}" title="${i+1}. ${s.title}"></button>`).join('');restore();goto(initial)}
function fit(){const v=document.querySelector('#viewport'),w=v.clientWidth,h=v.clientHeight,scale=Math.min(w/1600,h/900),wrap=document.querySelector('#stage-wrap');wrap.style.width=1600*scale+'px';wrap.style.height=900*scale+'px';stage.style.transform=`scale(${scale})`}
function goto(i){current=(i+SLIDES.length)%SLIDES.length;document.querySelectorAll('.slide').forEach((x,n)=>x.classList.toggle('active',n===current));document.querySelectorAll('#chapter-track button').forEach((x,n)=>x.classList.toggle('active',n===current));document.querySelector('#slide-count').textContent=`${current+1} / ${SLIDES.length}`;history.replaceState(null,'','#'+(current+1))}
function overview(){goto(2)}
function help(){document.querySelector('#modal-title').textContent='演示控制';document.querySelector('#modal-body').innerHTML='<div class="help-list"><kbd>← / →</kbd><span>前后翻页</span><kbd>Space</kbd><span>下一页</span><kbd>G</kbd><span>返回第3页作业目录</span><kbd>F</kbd><span>进入或退出全屏</span><kbd>Home / End</kbd><span>首页或末页</span><kbd>Esc</kbd><span>关闭弹窗</span></div>';modal.showModal()}
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1400)}
function save(){document.querySelectorAll('[data-save]').forEach(x=>localStorage.setItem('ai4s-assessment-'+x.dataset.save,x.value));toast('选题规划已保存在本地')}
function restore(){document.querySelectorAll('[data-save]').forEach(x=>x.value=localStorage.getItem('ai4s-assessment-'+x.dataset.save)||'')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){const x=a.dataset.action;if(x==='next')goto(current+1);if(x==='prev')goto(current-1);if(x==='overview')overview();if(x==='help')help();if(x==='fullscreen')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(x==='save')save()}const g=e.target.closest('[data-goto]');if(g){e.preventDefault();goto(+g.dataset.goto);}const mg=e.target.closest('[data-modal-goto]');if(mg){modal.close();goto(+mg.dataset.modalGoto)}const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('.rubric-tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.rubric-panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.querySelectorAll('.rubric-panel')[+tab.dataset.tab].classList.add('active')}const q=e.target.closest('[data-choice]');if(q){document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));q.classList.add('selected');const ok=q.dataset.choice==='2',f=document.querySelector('#quiz-feedback');f.className='quiz-feedback '+(ok?'':'wrong');f.textContent=ok?'正确。课程要求同学们使用可追溯证据检查平台输出，并说明局限。':'这个选择缺少独立核验。平台输出需要原文、复算或对照证据支持。'}})
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input')||modal.open)return;const k=e.key.toLowerCase();if(['arrowright','pagedown',' '].includes(k)){e.preventDefault();goto(current+1)}if(['arrowleft','pageup'].includes(k)){e.preventDefault();goto(current-1)}if(k==='g')overview();if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(k==='?')help();if(k==='home')goto(0);if(k==='end')goto(SLIDES.length-1)});window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=SLIDES.length)goto(n-1)});const initialHash=Number(location.hash.slice(1));render(initialHash?Math.min(Math.max(initialHash-1,0),SLIDES.length-1):0);fit();
</script>
