window.CASES={"faraday":{"kicker":"实验范式 / 电磁感应 / 1831","title":"一瞬间的偏转，揭示“变化”才是关键","scene":"两组线圈绕在同一铁环上。给一侧通电，另一侧检流计会一直偏转吗？","art":"faraday","steps":[["观察现象","接通与断开时，另一线圈出现短暂电流；电流稳定后，指针回到零。"],["测量与归纳","比较接通、稳定、断开三种状态及偏转方向，把“有电流”与“电流在变化”分开。"],["发现与推进","实验揭示电磁感应，促成后续定量规律与电磁理论研究，也为发电与变压技术奠基。"]],"question":"保持通电后指针归零，是否说明实验失败？","answer":"不是。这个“零结果”排除了“只要有电流就持续感应”的简单猜想；关键线索在变化过程。","takeaway":"实验范式：现象 → 可比较的测量 → 经验规律；归纳还需要更多条件下的检验。","refs":["faraday"]},"maxwell":{"kicker":"理论范式 / 电磁场 / 1865","title":"把电与磁写进方程，预言会传播的场","scene":"真空中没有导线，电磁影响如何传播？场之间的联系能否解释光？","art":"maxwell","steps":[["提出机制","变化的磁场联系电场；位移电流项把变化的电场纳入磁场关系。"],["数学化推演","联立场方程得到波动形式，传播速度 c = 1/√(μ₀ε₀)，与光速相联系。"],["发现与应用","提出光的电磁本质，使电、磁、光进入统一理论；后续实验与无线技术沿此发展。"]],"question":"方程预言了电磁波，就等于每一种通信设备已经得到验证吗？","answer":"没有。理论给出可检验的预测与设计基础，器件、材料、频段和传播环境仍要分别实验。","takeaway":"理论范式：机制 → 数学推演 → 新预测；理论的力量在于解释之外还能预言。","refs":["maxwell"]},"eniac":{"kicker":"计算范式 / 数值天气预报 / 1950","title":"方程难以手算时，把大气搬进计算机","scene":"已有描述大气运动的方程，能否从今天的观测出发，算出明天的环流？","art":"eniac","steps":[["建立模型","Charney 等以正压涡度方程近似大气演变，输入观测得到的初始场。"],["离散与求解","把连续空间变为格点，以数值积分推进时间，在 ENIAC 上开展 24 小时预报试验。"],["对照与修正","将预报与后续天气图比较，分析网格、初值与模型简化带来的误差，推进数值预报。"]],"question":"把网格无限加密，能否消除全部预报误差？","answer":"不能。初值、边界与近似方程都可能有误；计算精度更高，不等于科学模型一定更准确。","takeaway":"计算范式：把理论变成可求解的模型，探索难以直接实验或解析求解的复杂系统。","refs":["eniac"]},"bao":{"kicker":"数据范式 / SDSS 星系巡天 / 2005","title":"单颗星系看不见的线索，藏在总体统计里","scene":"一张星系照片无法测量宇宙的大尺度结构；大量星系位置合起来会出现什么？","art":"bao","steps":[["组织数据","把巡天中的红移、位置与选择条件整理为可比较的星系样本。"],["发现模式","统计不同间距的星系对，计算相关函数，从整体分布中辨认重子声学峰。"],["科学推进","将峰对应的特征尺度与物理模型联系，用作宇宙距离测量的“标准尺”。"]],"question":"星系数量足够多，统计峰就一定是真实的宇宙结构吗？","answer":"还要排除巡天选择、标定与统计处理造成的假峰，评估误差，并与独立样本和理论交叉检验。","takeaway":"数据范式：海量观测 → 统计结构 → 科学解释；数据规模不能替代误差与偏差分析。","refs":["bao"]},"alab":{"kicker":"智能范式 / A-Lab / 材料合成","title":"让一次合成的成败，改变下一次选择","scene":"计算提出了一个候选晶体，但数据库里的“可能存在”如何变成实验室里的样品？","art":"alab","steps":[["研究对象","无机材料的目标结构、前驱体与合成路线；候选结构不等于已经获得的物质。"],["科学目标","把计算筛选、文献知识、机器人合成与分析连接，让失败反馈参与选择下一轮实验。"],["证据标准","通过衍射等表征判断是否得到目标相；新颖性、纯度、可重复制备及性质需各自证据。"]],"question":"预测很稳定，且机器人完成了合成，能否立即称为新材料发现？","answer":"还需要确认产物结构与组成、是否已有报道，并复核样品。自动执行流程，不会自动保证科学结论。","takeaway":"智能范式把“选择下一步”接入反馈闭环；材料研究最终仍要回到可复核的实物证据。","refs":["alab","materials"]},"catalyst":{"kicker":"化学催化 / 移动机器人化学家 / 2020","title":"更好的催化配方，必须在反应里证明","scene":"同一光照条件下，不同混合配方产氢表现不同。下一轮该测哪一个组合？","art":"catalyst","steps":[["研究对象","光催化混合物及其组成、测试条件和产氢表现；把可调配方与固定条件分清。"],["科学目标","用算法选择更有希望或更有信息的实验，机器人完成测试，让结果更新下一轮选择。"],["证据标准","比较同条件基线与重复测量；若声称催化机理，还需超出性能提升的机制证据。"]],"question":"产氢表现提高，能否直接说明模型发现了新的催化机理？","answer":"不能。优化发现“什么组合更好”，机理解释还要区分因果因素，设计针对性的对照与表征。","takeaway":"同一组实验可以支持“性能改善”，却未必足以支持“机理已解释”。","refs":["catalyst"]},"weather":{"kicker":"气候气象 / GraphCast / Science 2023","title":"明天的风雨，先接受未见时段的检验","scene":"给出近期全球大气状态，模型预测未来天气。图像平滑、台风轨迹漂亮，够不够？","art":"weather","steps":[["研究对象","全球大气的温度、风、气压等时空场；GraphCast 聚焦中期天气预报。"],["科学目标","由历史再分析数据学习状态演变，递推未来天气，与数值预报基线比较。"],["证据标准","按时间划分留出数据，核对变量、区域、预报时效与极端事件；长期气候需另设验证。"]],"question":"十天天气预测较准，能否直接推出几十年气候变化也预测准确？","answer":"不能。时间尺度、外部强迫与目标不同；气候投影需要相应物理条件、长期评估与不确定性分析。","takeaway":"研究对象相似，科学目标仍可能不同；天气技能不能直接兑换为长期气候结论。","refs":["graphcast"]},"drug":{"kicker":"小分子药物设计 / GENTRL / 2019","title":"从“生成分子”到“测出活性”，还差关键一步","scene":"模型给出了一组可能抑制 DDR1 激酶的小分子。屏幕上的高分候选，如何成为证据？","art":"drug","steps":[["研究对象","分子的结构及靶点相互作用；结构编码要与可合成性和实验测量相连接。"],["科学目标","生成并筛选候选 DDR1 抑制剂，用实际合成与实验检测评估候选活性。"],["证据标准","合成确认与活性测定支撑当前结论；选择性、毒性、药代和临床疗效需进一步研究。"]],"question":"对靶点表现出活性，就可以称为有效治疗患者的药物吗？","answer":"不能。分子活性、细胞或动物证据、人体疗效属于不同层级，不能跳过后续研究直接推断。","takeaway":"药物发现要逐层建立证据：生成结构 → 获得化合物 → 测量活性 → 后续研究。","refs":["drug"]},"chip":{"kicker":"芯片设计 / 强化学习布局 / 2021","title":"把电路看成图，让布局接受工程检验","scene":"将大量宏单元放在有限芯片面积内：连线短、拥塞低、时序达标，如何同时考虑？","art":"chip","steps":[["研究对象","网表表示的电路连接图、宏单元及物理版图；可移动位置受几何与设计规则约束。"],["科学目标","学习布局策略，选择宏单元位置，使代理代价引导后续物理设计。"],["证据标准","在相同设计与约束下对照基线，并查看后续布线、时序及功耗等指标，不能只看奖励。"]],"question":"训练奖励更高，就能断言芯片的最终性能更好了吗？","answer":"不能。奖励是对目标的近似；需用下游设计流程和实际指标检验，也需说明基线与计算预算。","takeaway":"表示与奖励决定布局搜索方向；最终证据必须落到真实设计约束与下游指标。","refs":["chip"]},"semantic":{"kicker":"面向 6G 的研究方向 / DeepSC / 2021","title":"接收到的是字，还是任务需要的意思？","scene":"低信噪比下传递一句话：逐字还原与保留关键信息，评价标准会相同吗？","art":"semantic","steps":[["研究对象","文本语义表示、信道噪声与接收端重构；DeepSC 联合学习语义和传输过程。"],["科学目标","在受限传输条件下保留句子含义，把“传什么、如何传”放进统一建模。"],["证据标准","比较相同信道与资源预算下的语义指标，检查未见文本和信道；关键含义还需任务检验。"]],"question":"“可以降落”与“不可以降落”文字很接近，语义指标高就足够吗？","answer":"不够。少数关键字可能改变行动；应检查任务后果与关键语义错误，不能只看平均相似度。","takeaway":"当目标从比特转向语义，评价也要转向任务；优化什么，必须先由人定义。","refs":["semantic"]},"aisafety":{"kicker":"AI × 网络安全 / Big Sleep / 2024","title":"让 AI 找出“普通测试没碰到”的软件漏洞","scene":"数据库处理大多数输入都正常，一个特殊值却可能让程序读到数组之外。AI 怎样把怀疑变成证据？","art":"aisafety","steps":[["研究对象","SQLite 的源代码、修复记录与输入。Big Sleep 从已有修复线索出发，检查相似逻辑。"],["科学目标","让 AI 阅读代码、提出漏洞假设、生成测试输入，并利用运行工具的反馈继续定位问题。"],["证据标准","用可复现输入触发越界、定位原因，再由开发者修复。该漏洞在正式版本发布前已修复。"]],"question":"AI 说“这里可能有漏洞”，怎样把这句话变成可信的发现？","answer":"给出能重现问题的输入、程序版本与运行记录；定位原因后修复，再验证异常输入和正常功能。","takeaway":"AI 挖漏洞也是“假设 → 实验 → 证据 → 修正”：代码是对象，运行反馈是关键证据。","refs":["aisafety"]},"flow":{"kicker":"知识嵌入 / 不可压流动 / 交互计算","title":"让质量守恒成为搜索的边界","scene":"稳态、不可压、无泄漏的分流管：入口 10 mL/s，带误差的两个出口估计为 6 和 7。","art":"flow","steps":[["表示：人定义变量与前提","用出口通量 q₁、q₂ 表示系统；假定稳态、无源汇，则 q₁ + q₂ = 10。"],["搜索：知识进入目标函数","在贴近观测之外，惩罚质量不平衡；调大 λ，观察可接受的解如何向守恒关系靠近。"],["评估：回到科学证据","同时看观测偏差、守恒残差与独立测量；守恒只是流场成立的必要条件之一。"]],"question":"把 λ 调到无限大，是否就获得了真实流场？","answer":"没有。若存在积蓄或泄漏，强加此约束会出错；即使守恒，也还需动量方程、边界条件与独立测量。","takeaway":"人给出“稳态、不可压、无源汇”，AI 才在这个边界内搜索；边界错，答案也可能错。","refs":["pinn","knowledge","local"]},"power":{"kicker":"知识发现 / 轨道规律 / 交互计算","title":"搜索空间里没有幂律，就找不到幂律","scene":"同样的四颗内侧行星、同样的留出检验：只准搜索直线，与允许搜索幂律，有什么不同？","art":"power","steps":[["表示：选择有意义的变量","用 a/AU 与 T/年表示轨道尺度和周期；研究对象选为围绕同一中心天体的行星。"],["搜索：限定候选表达","先只提供 T = b + ka，再允许 T = caᵖ；浏览器即时拟合对应参数。"],["评估：外推与解释","比较训练与外侧行星误差；幂律拟合不是引力证明，也不是无限表达式空间的自主发现。"]],"question":"如果只允许直线，再多算一百万次，能自动跳出这个函数族吗？","answer":"不能。需要人改变表示或候选空间。引入幂律让相关规律变得可表达，但能否成立仍由新证据检验。","takeaway":"人类决定可表达的规律、可搜索的候选和可接受的证据；AI 在其中学习与选择。","refs":["nasa","kepler","knowledge","local"]},"protocol":{"kicker":"安全协议 / 5G AKA / CCS 2018","title":"协议可靠与否，要写成可检验的命题","scene":"终端、服务网络和归属网络交换消息后，双方是否真的确认了对方身份？","art":"protocol","steps":[["研究对象","5G AKA 的消息、参与方、密钥与信任假设；模型必须明确攻击者可以做什么。"],["科学目标","用 Tamarin 对形式化协议模型推理，分析认证与密钥相关的安全目标。"],["证据标准","给出特定前提下的证明或反例轨迹；协议版本、信道假设、实现细节决定结论边界。"]],"question":"若以后由 AI 自动写协议模型，最终应该相信自然语言解释还是可复核的验证结果？","answer":"需检查模型是否忠实于协议，再复核证明或反例。自动生成与自动验证是不同环节，前者不能替代后者。","takeaway":"安全方向的证据可以是形式化验证；经典自动推理为 AI 生成方案提供可检验的边界。","refs":["protocol"]}};
window.SLIDES=[{"id":"opening","chapter":"导论","title":"科学智能原理与实践","minutes":2,"body":"\n <div class=\"cover-copy\"><div class=\"eyebrow\">AI FOR SCIENCE · LECTURE 01</div><h1>让 AI 参与<br><em>科学发现</em></h1><p class=\"cover-sub\">从一个预测，到一条可信的证据链</p><div class=\"cover-byline\">鄂海红 · 课程负责人<br><span>北京邮电大学 / 2026.09.22</span></div></div>\n <div class=\"cover-art\" data-art=\"orbit\"></div><div class=\"cover-bottom\"><span>科学智能原理与实践</span><span>问题 → 模型 → 验证 → 新问题</span></div>","refs":["outline"],"type":"cover"},{"id":"opening-poll","chapter":"提出问题","title":"如果 AI 给出了漂亮的结果，科学发现发生了吗？","minutes":3,"body":"\n <p class=\"lead\">请先独立判断，再与邻座交换理由。</p><div class=\"quiz\" data-quiz=\"opening\"><button data-answer=\"0\"><b>A</b><span>答案看起来合理，已经可以写入结论</span></button><button data-answer=\"1\"><b>B</b><span>多个 AI 都同意，可信度就足够了</span></button><button data-answer=\"2\"><b>C</b><span>还需要可检验的假设与独立证据</span></button></div><div class=\"quiz-feedback\" aria-live=\"polite\">先保留你的选择。今天结束时，我们再回答一次。</div><div class=\"micro\">举手表达你的选择，并用一句话说明理由。</div>","refs":["outline","knowledge"]},{"id":"outcomes","chapter":"学习目标","title":"90 分钟后，你能完成三件事","minutes":2,"body":"\n <div class=\"outcomes\"><div class=\"number-item\"><span>01</span><div><h3>辨认一个 AI4S 问题</h3><p>说清科学对象、研究问题，以及 AI 改变了哪个研究环节。</p></div></div><div class=\"number-item\"><span>02</span><div><h3>跑通一个验证过程</h3><p>区分训练拟合与外部验证，解释为什么要记录失败。</p></div></div><div class=\"number-item\"><span>03</span><div><h3>提出一份可执行的研究草案</h3><p>写出假设、基线、验证标准，并带着问题走进周四讲座。</p></div></div></div><div class=\"side-mark\">理解<br>动手<br>质疑</div>","refs":["outline"]},{"id":"course-map","chapter":"课程地图","title":"基础 → 领域 → 实践","minutes":2,"body":"\n <div class=\"course-map\"><div><strong>8<span>学时</span></strong><h3>共性原理</h3><p>导论 · AI-Ready 数据<br>统一表征与科学基础模型<br>科学推理与智能体</p></div><div><strong>20<span>学时</span></strong><h3>领域前沿</h3><p>通信 · 数学 · 安全<br>医学 · 材料 · 芯片<br><small>领域专题按学期课表开展</small></p></div><div><strong>4<span>学时</span></strong><h3>平台实践与伦理</h3><p>数据—模型—推理—验证<br>可复现实践作品<br>科研诚信与责任</p></div></div><div class=\"takeaway\">32 学时 / 2 学分　·　大师讲堂穿插安排　·　今天建立贯通全课的方法框架</div>","refs":["outline"]},{"id":"why-now","chapter":"01 / 理解科学智能","title":"为什么此时学习 AI4S？","minutes":3,"body":"\n <div class=\"split\"><div><p class=\"statement\">科学问题没有变简单，<br><em>可调用的研究能力</em><br>正在发生变化。</p><div class=\"pills\"><span class=\"tag \">高维设计空间</span><span class=\"tag \">稀缺而昂贵的实验</span><span class=\"tag \">多模态科学数据</span></div></div><div class=\"vertical-notes policy-notes\"><div class=\"number-item\"><span>①</span><div><h3>模型能力</h3><p>从分类与预测，走向生成、推理和工具调用。</p></div></div><div class=\"number-item\"><span>②</span><div><h3>科学条件</h3><p>数据、算力、科学软件与自动化设备逐步连接。</p></div></div><div class=\"number-item\"><span>③</span><div><h3>国际布局</h3><p><b>美国“创世计划”（Genesis Mission）</b><br>总统行政令启动、跨部门协调；能源部实施。<br><b>中国“人工智能+”</b>：科学技术重点行动。</p></div></div></div></div>","refs":["cas","genesisNational","genesis","china"]},{"id":"paradigms","chapter":"01 / 理解科学智能","title":"五种范式，扩展我们获得知识的方式","minutes":3,"body":"\n <p class=\"lead small\">从一个具体发现进入：点击面板，看知识是怎样获得的。</p><div class=\"paradigms case-paradigms\"><button class=\"case-link\" data-case-group=\"paradigms\" data-case-id=\"faraday\"><span class=\"case-number\">01</span><h3>实验</h3><p>观察与归纳<br><b>法拉第电磁感应</b></p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"paradigms\" data-case-id=\"maxwell\"><span class=\"case-number\">02</span><h3>理论</h3><p>机制与数学推演<br><b>麦克斯韦电磁波</b></p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"paradigms\" data-case-id=\"eniac\"><span class=\"case-number\">03</span><h3>计算</h3><p>建模与数值求解<br><b>ENIAC 天气预报</b></p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"paradigms\" data-case-id=\"bao\"><span class=\"case-number\">04</span><h3>数据</h3><p>总体统计与模式<br><b>星系巡天声学峰</b></p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"paradigms\" data-case-id=\"alab\"><span class=\"case-number\">05</span><h3>智能</h3><p>选择与反馈迭代<br><b>A-Lab 材料合成</b></p><span class=\"case-open\">进入科学现场 ↗</span></button></div><div class=\"paradigm-example\"><span>观察 → 预测 → 检验</span><p>这项发现依靠什么方法？支持结论的关键证据是什么？</p></div><div class=\"takeaway\">五种范式扩展研究能力，并非彼此替代；智能闭环仍依赖实验、理论、计算与数据。</div>","refs":["paradigm","cas","wang"]},{"id":"definition","chapter":"01 / 理解科学智能","title":"AI4S 的核心对象是科学问题","minutes":2,"body":"\n <p class=\"lead small\">让 AI 进入建模与发现，并接受科学证据检验。先回答三个具体问题。</p><div class=\"definition-lenses\"><div><b>研究对象</b><span>催化配方、时空大气场，还是程序行为？</span></div><div><b>科学目标</b><span>提高性能、预测演变，还是寻找漏洞？</span></div><div><b>证据标准</b><span>实物测量、未见时段，还是可复现的漏洞？</span></div></div><div class=\"object-case-grid\"><button class=\"case-link\" data-case-group=\"objects\" data-case-id=\"catalyst\"><h3>催化合成</h3><p>配方 → 反应表现</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"objects\" data-case-id=\"weather\"><h3>气候气象</h3><p>大气场 → 天气预测</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"objects\" data-case-id=\"drug\"><h3>小分子药物</h3><p>结构 → 靶点活性</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"objects\" data-case-id=\"alab\"><h3>材料制备</h3><p>候选 → 实物表征</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"objects\" data-case-id=\"chip\"><h3>芯片设计</h3><p>网表 → 物理布局</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"objects\" data-case-id=\"semantic\"><h3>6G 语义通信</h3><p>信息 → 任务语义</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"objects\" data-case-id=\"aisafety\"><h3>AI 网络安全</h3><p>代码 → 漏洞验证</p><span class=\"case-open\">进入科学现场 ↗</span></button><div class=\"case-invitation\"><b>换一个专业试着类比</b><p>它需要怎样的证据？</p></div></div>","refs":["cas","outline"]},{"id":"three-drivers","chapter":"01 / 理解科学智能","title":"数据、知识与机理，共同约束模型","minutes":3,"body":"\n <div class=\"triangle-layout\"><div class=\"triangle-visual\" data-art=\"triangle\"></div><div class=\"vertical-notes\"><div class=\"number-item\"><span>D</span><div><h3>数据驱动</h3><p>从观测中学习映射：轨道尺度 → 公转周期。</p></div></div><div class=\"number-item\"><span>K</span><div><h3>知识驱动</h3><p>用单位、对象关系与已有结论限定搜索。</p></div></div><div class=\"number-item\"><span>P</span><div><h3>机理驱动</h3><p>用方程、守恒律、对称性约束预测。</p></div></div></div></div><div class=\"takeaway\">同一个模型可以融合三者；知识更宽，机理强调可计算的作用规律。</div>","refs":["knowledge","outline"]},{"id":"loop","chapter":"01 / 理解科学智能","title":"一次科学发现，需要怎样的闭环？","minutes":3,"body":"\n <div class=\"discovery-loop\"><div class=\"flow-step\"><span class=\"mono\">1</span><h3>科学假设</h3><p>写清对象、变量和可被推翻的判断</p></div><div class=\"flow-step\"><span class=\"mono\">2</span><h3>计算推演</h3><p>用数据、模型和领域知识得到预测</p></div><div class=\"flow-step\"><span class=\"mono\">3</span><h3>独立验证</h3><p>新数据、实验、仿真对照或形式化证明</p></div><div class=\"flow-step\"><span class=\"mono\">4</span><h3>反馈修正</h3><p>记录失败，更新模型、假设与实验</p></div></div><div class=\"return-line\">← 新证据改变下一步的选择 ←</div><div class=\"split slim\"><p><b>AI 可以参与：</b>搜索、建模、生成、优化、编排。</p><p><b>人类负责：</b>问题价值、关键判断、验证与责任。</p></div>","refs":["outline","cas","knowledge"]},{"id":"kepler-brief","chapter":"02 / 从数据到规律","title":"给 AI 四颗行星，它能预测其余四颗吗？","minutes":2,"body":"\n <div class=\"split\"><div><p class=\"statement\">已知：轨道尺度 <i>a</i><br>目标：预测公转周期 <i>T</i></p><div class=\"dataset-split\"><div><span>训练 · 4 颗</span><b>水星　金星　地球　火星</b></div><div><span>留出验证 · 4 颗</span><b>木星　土星　天王星　海王星</b></div></div><p class=\"micro\">数据：NASA 汇编的 8 行星近似轨道参数。</p></div><div class=\"lab-question\"><div class=\"eyebrow\">先预测 · 再运行</div><h2>哪一种规律<br>走得更远？</h2><p>直线　/　三次多项式　/　幂律</p><span>评价标准：未见行星的相对误差</span></div></div>","refs":["nasa","kepler","local"]},{"id":"kepler-live","chapter":"02 / 从数据到规律","title":"现场实验 01 · 从数据拟合轨道规律","minutes":7,"body":"<div id=\"kepler-lab\" class=\"lab-host\"></div>","refs":["nasa","kepler","local"],"type":"lab"},{"id":"kepler-meaning","chapter":"02 / 从数据到规律","title":"低训练误差，并不能保证外推正确","minutes":3,"body":"\n <div class=\"cols three\"><div class=\"card blue\"><h3>拟合</h3><p>一个四参数多项式，能穿过四个训练点。</p></div><div class=\"card teal\"><h3>检验</h3><p>外侧行星检查模型在新范围内是否成立。</p></div><div class=\"card amber\"><h3>解释</h3><p>幂律关系还需要动力学机制与适用条件。</p></div></div><div class=\"equation-strip\"><span>数据中的规律</span><strong>T ≈ c · a<sup>1.5</sup></strong><span>机制中的关系</span><strong>T² = <span class=\"fraction\"><span>4π²</span><span>G(M + m)</span></span> a³</strong></div><div class=\"takeaway\">同一中心天体、近似两体问题；发现经验规律与解释规律是不同层次。</div>","refs":["kepler","knowledge","local"]},{"id":"two-paths","chapter":"02 / 从数据到规律","title":"两条互补路径：把知识放进去，把规律找出来","minutes":3,"body":"\n <div class=\"two-paths\"><div><span class=\"mono\">KNOWLEDGE → MODEL</span><h2>知识嵌入</h2><p>已有物理规律、对称性和量纲<br>进入模型结构、损失或约束。</p><button class=\"example case-example\" data-case-group=\"paths\" data-case-id=\"flow\">流场与质量守恒：调一调约束强度 ↗</button></div><div><span class=\"mono\">DATA → KNOWLEDGE</span><h2>知识发现</h2><p>从观测中搜索候选表达<br>再以误差、简洁性与验证筛选。</p><button class=\"example case-example\" data-case-group=\"paths\" data-case-id=\"power\">轨道与幂律：换一换候选函数族 ↗</button></div></div><div class=\"takeaway\">表示 → 搜索 → 评估：人类给出的表示与约束，决定 AI 能探索什么。</div>","refs":["knowledge","pinn"]},{"id":"representation","chapter":"02 / 从数据到规律","title":"科学基础模型，要读懂科学对象","minutes":3,"body":"\n <div class=\"representations\"><div><div class=\"glyph sequence\">A C G T<br>G T A C</div><h3>序列</h3><p>位置、顺序、依赖</p></div><div><div class=\"glyph\" data-art=\"molecule\"></div><h3>分子 / 结构</h3><p>连接、几何、对称性</p></div><div><div class=\"glyph\" data-art=\"wave\"></div><h3>光谱 / 场</h3><p>单位、尺度、边界</p></div></div><div class=\"representation-arrow\">统一表征 → 预训练 → 任务适配 → 科学验证</div><p class=\"lead small\">论文文本承载知识；原始科学数据还包含文本之外的结构与测量信息。</p>","refs":["wang","astronomy","outline"]},{"id":"checkpoint","chapter":"阶段回顾 / 从数据到规律","title":"一个检查：模型在什么情况下更值得信任？","minutes":4,"body":"\n <p class=\"lead\">模型 A：训练误差更低。模型 B：训练误差略高，但在新条件下验证更好。</p><div class=\"quiz\" data-quiz=\"checkpoint\"><button data-answer=\"0\"><b>A</b><span>一定选 A：训练误差是唯一标准</span></button><button data-answer=\"1\"><b>B</b><span>优先审查 B 的验证质量与适用范围</span></button><button data-answer=\"2\"><b>C</b><span>让大语言模型投票决定</span></button></div><div class=\"quiz-feedback\" aria-live=\"polite\">给出选择，并说清你还想查看什么证据。</div>","refs":["outline","local"]},{"id":"part-two","chapter":"从预测到行动","title":"如果实验很贵，下一次该做什么？","minutes":1,"body":"\n <div class=\"chapter-cover\"><span class=\"mono\">PART 02 / DECISION & EVIDENCE</span><h1>从预测结果<br>到<em>选择行动</em></h1><p>第二个实验：让新证据决定下一次研究</p></div><div class=\"chapter-number\">02</div>","refs":["local"],"type":"chapter"},{"id":"frontier","chapter":"03 / 从预测到行动","title":"前沿突破改变了哪些研究步骤？","minutes":3,"body":"\n <div class=\"frontier-grid\"><div class=\"frontier-feature\"><span class=\"mono\">ALPHAFOLD 3 · 2024</span><h2>从序列与组分<br>预测复合物结构</h2><div class=\"protein-art\" data-art=\"protein\"></div><p>结构预测支持后续研究设计；结合、功能与应用仍需相应验证。</p><small>图：蛋白质结构示意。</small></div><div class=\"vertical-notes\"><div class=\"number-item\"><span>01</span><div><h3>预测能力</h3><p>把高维结构搜索转化为可计算的候选。</p></div></div><div class=\"number-item\"><span>02</span><div><h3>材料设计</h3><p>性质预测之后，还要制备、表征与反馈。</p></div></div><div class=\"number-item\"><span>03</span><div><h3>共同瓶颈</h3><p>模型输出能否进入真实、可重复的验证过程？</p></div></div></div></div>","refs":["af3","materials"]},{"id":"domains","chapter":"03 / 从预测到行动","title":"不同学科，可以使用同一套提问方式","minutes":3,"body":"\n <div class=\"domain-grid domain-case-grid\"><button class=\"case-link\" data-case-group=\"domains\" data-case-id=\"semantic\"><h3>通信 · DeepSC</h3><p>低误码之外，意思传对了吗？<br><b>检验：</b>语义与任务、未见信道</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"domains\" data-case-id=\"flow\"><h3>数学 · 流动约束</h3><p>拟合了测量，是否也满足质量守恒？<br><b>检验：</b>方程残差与独立数据</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"domains\" data-case-id=\"protocol\"><h3>安全 · 5G AKA</h3><p>认证结论依赖哪些信任假设？<br><b>检验：</b>形式化证明或反例</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"domains\" data-case-id=\"drug\"><h3>医学 · 分子药物设计</h3><p>生成了候选，是否测出了靶点活性？<br><b>检验：</b>合成与活性、后续研究</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"domains\" data-case-id=\"alab\"><h3>材料 · A-Lab</h3><p>预测存在的结构，能否得到实物？<br><b>检验：</b>合成、衍射与复核</p><span class=\"case-open\">进入科学现场 ↗</span></button><button class=\"case-link\" data-case-group=\"domains\" data-case-id=\"chip\"><h3>芯片 · 学习布局</h3><p>代理奖励更高，最终设计更好吗？<br><b>检验：</b>布线、时序与工程约束</p><span class=\"case-open\">进入科学现场 ↗</span></button></div><p class=\"micro\">点击任一场景展开案例 · 方法可以迁移，科学结论必须匹配本领域的证据标准。</p>","refs":["outline"]},{"id":"materials-brief","chapter":"03 / 从预测到行动","title":"实验预算有限，怎样更快找到好配方？","minutes":2,"body":"\n <div class=\"split\"><div><p class=\"statement\">配方比例 <i>x</i> ∈ [0, 1]<br>→ 材料性能 <i>y</i></p><div class=\"budget\"><strong>3</strong><span>个初始实验</span><b>+</b><strong>12</strong><span>次可用新实验</span></div><p class=\"lead small\">每轮先提建议，再打开“虚拟实验室”取得反馈。</p></div><div class=\"lab-question\"><div class=\"eyebrow\">课堂挑战</div><h2>选看起来最好，<br>还是最不确定？</h2><p>比较：手选 / GP-UCB / 随机基线</p><span>本实验使用虚拟材料响应曲线</span></div></div>","refs":["materials","local"]},{"id":"materials-live","chapter":"03 / 从预测到行动","title":"现场实验 02 · 让模型选择下一次实验","minutes":8,"body":"<div id=\"materials-lab\" class=\"lab-host\"></div>","refs":["local","materials"],"type":"lab"},{"id":"benchmark","chapter":"03 / 从预测到行动","title":"一次赢过随机，还不足以证明方法有效","minutes":3,"body":"\n <div class=\"split\"><div><p class=\"statement\">公平比较需要<br><em>同预算、同起点、<br>多次运行</em>。</p><p class=\"lead small\">60 个种子 · 每次 12 个总实验<br>3 个初始点 + 9 个新增点</p><button class=\"primary\" data-action=\"benchmark\">运行参数对照</button></div><div id=\"benchmark-output\" class=\"benchmark-panel\"><div class=\"eyebrow\">先写下评价标准</div><h3>比较发现的最佳性能</h3><p>同时报告赢、平、输，以及平均结果。</p><p class=\"micro\">在同一组虚拟响应曲线上，比较不同探索权重的表现。</p></div></div>","refs":["local","mit"]},{"id":"agents","chapter":"04 / 走向科研平台","title":"科研智能体，把工具组织成可检验的行动","minutes":3,"body":"\n <div class=\"agent-architecture\"><div class=\"agent-top\"><span>人类科学家</span><p>定义问题 · 设定约束 · 审查关键证据</p></div><div class=\"agent-core\"><span>规划</span><i>→</i><span>工具调用</span><i>→</i><span>记忆 / 记录</span><i>→</i><span>反馈修正</span></div><div class=\"agent-tools\"><span>文献与数据库</span><span>模型与科学软件</span><span>实验 / 仿真 / 证明器</span></div></div><div class=\"takeaway\">可追溯的工具结果与验证记录，支撑每一步判断。</div>","refs":["cas","astronomy","zhou"]},{"id":"agi4s","chapter":"04 / 走向科研平台","title":"从 AI4S 到 AGI4S：科学与智能相互促进","minutes":3,"body":"\n <div class=\"dual-wheel\"><div><span class=\"mono\">AI → SCIENCE</span><h2>AI 推进科学</h2><p>扩大搜索空间<br>提高建模能力<br>选择更有信息的行动</p></div><div class=\"wheel-center\">↔</div><div><span class=\"mono\">SCIENCE → AI</span><h2>科学推动 AI</h2><p>提出开放而复杂的问题<br>提供真实世界反馈<br>检验推理与持续学习</p></div></div><div class=\"agi-line\">走向更通用的科学智能：跨任务迁移 · 长程推理 · 工具协同 · 从失败中学习</div><p class=\"micro\">AGI4S 的研究目标：让 AI 跨任务组织科学研究，并从真实验证中持续学习。</p>","refs":["zhou","duanyan"]},{"id":"trust","chapter":"04 / 走向科研平台","title":"一份可信研究，应能追溯整个过程","minutes":3,"body":"\n <div class=\"evidence-chain\"><div class=\"flow-step\"><span class=\"mono\">01</span><h3>来源</h3><p>数据 / 文献版本\n授权与适用范围</p></div><div class=\"flow-step\"><span class=\"mono\">02</span><h3>过程</h3><p>代码 / 参数 / 模型\n工具调用与随机种子</p></div><div class=\"flow-step\"><span class=\"mono\">03</span><h3>证据</h3><p>基线 / 对照 / 失败\n原始结果与不确定性</p></div><div class=\"flow-step\"><span class=\"mono\">04</span><h3>结论</h3><p>支持到什么程度\n仍缺什么验证</p></div></div><div class=\"responsibility\"><strong>使用 AI，也要承担科研责任</strong><span>核查引用　·　保留原始结果　·　说明 AI 贡献　·　保护敏感数据</span></div>","refs":["outline","cas","zhou"]},{"id":"assessment","chapter":"05 / 课程实践与考核","title":"用一项可复核的研究实践，完成这门课","minutes":3,"body":"\n <div class=\"assessment-chart\"><div class=\"grade grade-0\"><strong>10<span>%</span></strong><h3>课堂参与</h3><p>出勤、讨论、大师讲堂参与<br>与随堂学习</p></div><div class=\"grade grade-1\"><strong>30<span>%</span></strong><h3>开题设计报告</h3><p>跨专业组队选题<br>文献调研、假设与初步路线</p></div><div class=\"grade grade-2\"><strong>60<span>%</span></strong><h3>创新实践与报告</h3><p>作品 + 完整创新实践报告<br>科学问题、方法、验证与成果</p></div></div><div class=\"takeaway\">过程考核 40% + 期末考核 60%　·　不设闭卷考试　·　鼓励跨学科组队</div>","refs":["outline"]},{"id":"deliverables","chapter":"05 / 课程实践与考核","title":"优秀作品，让问题、方法与证据彼此对应","minutes":3,"body":"\n <div class=\"split\"><div class=\"vertical-notes\"><div class=\"number-item\"><span>开题</span><div><h3>问题与假设</h3><p>研究现状、科学对象、可证伪假设、初步路线。</p></div></div><div class=\"number-item\"><span>实践</span><div><h3>数据与对照</h3><p>数据或知识来源、基线、运行记录、验证方案。</p></div></div><div class=\"number-item\"><span>期末</span><div><h3>成果与边界</h3><p>作品、完整报告、失败分析、可复现说明。</p></div></div></div><div class=\"review-list\"><h3>优秀作品的五个标准</h3><p><b>01</b> 科学问题的重要性与清晰度</p><p><b>02</b> 文献调研的充分性</p><p><b>03</b> 技术路线的合理性</p><p><b>04</b> 验证方案的严谨性</p><p><b>05</b> 创新潜力</p></div></div>","refs":["outline"]},{"id":"project-canvas","chapter":"05 / 课程实践与考核","title":"四分钟，把兴趣改写为一个可检验的问题","minutes":4,"body":"\n <div class=\"worksheet\" id=\"worksheet\"><label>我的科学问题<textarea id=\"ws-question\" placeholder=\"例如：在新场景中，物理先验能否改善信道预测？\"></textarea></label><label>可证伪的假设<textarea id=\"ws-hypothesis\" placeholder=\"相同训练数据下，加入约束后，留出场景误差更低。\"></textarea></label><label>数据与比较基线<textarea id=\"ws-data\" placeholder=\"数据来源、训练/验证如何划分？与哪种简单方法比较？\"></textarea></label><label>什么结果会让我改变判断？<textarea id=\"ws-test\" placeholder=\"测什么指标？哪种失败会推翻假设？还缺哪种真实证据？\"></textarea></label></div><div class=\"worksheet-bottom\"><span>个人写 1 分钟 → 邻座质询 2 分钟 → 修改 1 分钟</span><button class=\"primary\" data-action=\"export-worksheet\">下载研究草案</button></div><p class=\"micro\">在你的课件副本中填写并下载草案；内容保存在当前浏览器。</p>","refs":["outline","local"]},{"id":"thursday","chapter":"06 / 从导论走向前沿","title":"周四，把今天的问题带到研究现场","minutes":3,"body":"\n <div class=\"guest-date\">2026.09.24 · 周四大师讲堂</div><div class=\"guest-grid\"><div><span class=\"mono\">01 / 前沿主旨</span><h2>人工智能与科学发现：<br>双轮驱动新范式变革</h2><h3>周伯文 <small>上海人工智能实验室主任</small></h3><p>从 AI4S 到 AGI4S：科研范式变革<br>AGI4S 背后的关键技术基础原理<br>AGI4S 全链条创新的新范式认知</p></div><div><span class=\"mono\">02 / 平台实践</span><h2>「书生·端砚」<br>AI 时代的科学研究</h2><h3>杨阳 <small>科研产品平台部</small></h3><p>从假设到验证<br>科研自进化、科研可信、真实验证<br>平台能力预览、实践课题介绍与交流</p></div></div><div class=\"guest-question\">带去一个问题：当模型与实验矛盾时，系统如何改变下一步，并保留证据？</div>","refs":["zhou","duanyan","outline"]},{"id":"exit","chapter":"回顾与下一步","title":"把“一个答案”，推进为“一项研究”","minutes":3,"body":"\n <div class=\"exit-message\"><h1>问题明确<br>方法可算<br><em>证据可查</em></h1><div><span class=\"mono\">EXIT TICKET</span><h3>离开教室前，写下三句话</h3><p>① 我想研究的科学问题是……</p><p>② AI 可以参与的环节是……</p><p>③ 要相信结果，我还需要……</p><div class=\"reading\"><b>周四前准备</b><p>带上研究草案；阅读一篇核心导读；<br>准备一个关于验证或平台实践的问题。</p></div></div></div>","refs":["outline","cas","knowledge"],"type":"closing"},{"id":"reading","chapter":"课后阅读 / 参考资料","title":"核心导读与论据来源","minutes":0,"body":"<div class=\"reference-list\" data-refs-list=\"cas,paradigm,knowledge,astronomy,materials,wang\"></div>","refs":["cas","knowledge"],"appendix":true},{"id":"external-sources","chapter":"课后阅读 / 参考资料","title":"数据、前沿案例与平台依据","minutes":0,"body":"<div class=\"reference-list\" data-refs-list=\"nasa,kepler,af3,duanyan,zhou,china,genesis\"></div>","refs":["nasa","duanyan"],"appendix":true}];

/* Numerical methods used live in the lecture. No API calls or pretrained output. */
(function (root) {
  'use strict';
  const planets = [
    ['水星',57.9,88.0],['金星',108.2,224.7],['地球',149.6,365.2],['火星',228.0,687.0],
    ['木星',778.5,4331],['土星',1432.0,10747],['天王星',2867.0,30589],['海王星',4515.0,59800]
  ].map(([name,d,t])=>({name,distanceMillionKm:d,periodDays:t,x:d/149.5978707,y:t/365.25}));
  function rng(seed){let s=seed>>>0;return ()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
  function solve(A,b){const n=b.length,a=A.map((r,i)=>[...r,b[i]]);for(let k=0;k<n;k++){let p=k;for(let j=k+1;j<n;j++)if(Math.abs(a[j][k])>Math.abs(a[p][k]))p=j;if(Math.abs(a[p][k])<1e-14)throw Error('Singular system');[a[k],a[p]]=[a[p],a[k]];const q=a[k][k];for(let j=k;j<=n;j++)a[k][j]/=q;for(let i=0;i<n;i++)if(i!==k){const t=a[i][k];for(let j=k;j<=n;j++)a[i][j]-=t*a[k][j];}}return a.map(r=>r[n]);}
  function linear(xs,ys){const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;const slope=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/xs.reduce((s,x)=>s+(x-mx)**2,0);return [my-slope*mx,slope];}
  function fitPlanets(kind='power',noise=0,seed=22){const rand=rng(seed),train=planets.slice(0,4).map(p=>({...p,y:p.y*(1+noise*(2*rand()-1))}));let predict,params;
    if(kind==='power'){const [a,b]=linear(train.map(p=>Math.log(p.x)),train.map(p=>Math.log(p.y)));params=[Math.exp(a),b];predict=x=>params[0]*x**params[1];}
    else if(kind==='linear'){params=linear(train.map(p=>p.x),train.map(p=>p.y));predict=x=>params[0]+params[1]*x;}
    else {params=solve(train.map(p=>[1,p.x,p.x*p.x,p.x**3]),train.map(p=>p.y));predict=x=>params.reduce((s,c,i)=>s+c*x**i,0);}
    const mape=ds=>ds.reduce((s,p)=>s+Math.abs(predict(p.x)-p.y)/p.y,0)/ds.length*100;
    return {kind,train,params,predict,trainError:mape(train),testError:mape(planets.slice(4))};
  }
  // A deliberately synthetic materials response, NOT measured laboratory data.
  function materialTruth(x,seed=24){const shift=((seed%7)-3)*.006;return .20+.44*Math.exp(-(((x-.25-shift)/.16)**2))+.72*Math.exp(-(((x-.76+shift)/.10)**2))+.025*Math.sin(20*x);}
  const kernel=(x,z)=>.30**2*Math.exp(-.5*((x-z)/.16)**2);
  function gp(points){const n=points.length,mean=.45,noise=.025;const K=points.map((p,i)=>points.map((q,j)=>kernel(p.x,q.x)+(i===j?noise**2+1e-9:0)));const alpha=solve(K,points.map(p=>p.y-mean));

  if(kind==='orbit'){let lines='';for(let j=1;j<=11;j++){const points=[];for(let i=0;i<=180;i++){const a=i/180*Math.PI*2,r=36+j*29,x=440+r*Math.cos(a),y=430+.59*r*Math.sin(a);points.push(`${x},${y}`)}lines+=`<polyline points="${points.join(' ')}" fill="none" stroke="${j%3===0?C.teal:'#34536b'}" stroke-width="${j%3===0?1.5:1}" opacity="${j%3===0?.6:.55}" transform="rotate(-32 440 430)"/>`;const a=j*.93,x=440+(36+j*29)*Math.cos(a),y=430+.59*(36+j*29)*Math.sin(a);lines+=`<circle cx="${x}" cy="${y}" r="${j%3===0?7:4}" fill="${j%3===0?C.teal:C.blue}" transform="rotate(-32 440 430)"/>`;}
   return svg(`<g>${lines}<circle cx="440" cy="430" r="16" fill="${C.amber}"/><circle cx="440" cy="430" r="26" fill="none" stroke="${C.amber}" opacity=".4"/><path d="M75 690L720 163M100 200L790 660" stroke="#274156" stroke-dasharray="3 10"/></g>`,'0 0 870 825');
  }
  if(kind==='triangle')return svg(`<path d="M320 65L85 370H555Z" fill="#10303f" stroke="#42667b" stroke-width="2"/><path d="M320 65L320 245L85 370M320 245L555 370" fill="none" stroke="#42667b" stroke-dasharray="5 7"/><circle cx="320" cy="245" r="76" fill="#184b46" stroke="${C.teal}"/><text x="320" y="239" fill="${C.ink}" font-size="31" text-anchor="middle">科学</text><text x="320" y="279" fill="${C.ink}" font-size="31" text-anchor="middle">建模</text>${[[320,55,'数据'],[85,401,'知识'],[555,401,'机理']].map(([x,y,t])=>`<circle cx="${x}" cy="${y-10}" r="44" fill="#0f2537" stroke="${C.blue}"/><text x="${x}" y="${y}" text-anchor="middle" font-size="28" fill="${C.ink}">${t}</text>`).join('')}`,'0 0 640 450');
  if(kind==='molecule'){const nodes=[[90,70],[170,32],[250,78],[246,150],[163,190],[85,148]],bonds=nodes.map((p,i)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${nodes[(i+1)%6][0]}" y2="${nodes[(i+1)%6][1]}" stroke="${C.blue}" stroke-width="4"/>`).join('');return svg(bonds+nodes.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="13" fill="${i%2?C.blue:C.teal}"/>`).join(''),'0 0 340 210');}
  if(kind==='wave'){const points=Array.from({length:200},(_,i)=>`${15+i*1.5},${110+45*Math.sin(i*.1)*Math.exp(-(((i-100)/65)**2))}`);return svg(`<path d="M15 185H325M15 185V20" stroke="${C.line}" fill="none"/><polyline points="${points.join(' ')}" fill="none" stroke="${C.teal}" stroke-width="4"/>`,'0 0 340 210');}
  if(kind==='protein'){let seg='';const pts=Array.from({length:100},(_,i)=>{const a=i*.26;return [160+Math.sin(a)*70+Math.cos(a*.37)*42,35+i*1.65+Math.cos(a)*19]});for(let i=1;i<pts.length;i++)seg+=`<line x1="${pts[i-1][0]}" y1="${pts[i-1][1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="${i<50?C.teal:C.blue}" stroke-width="7" stroke-linecap="round"/>`;return svg(seg,'0 0 330 250');}
  return '';
 }
 function modal(title,body){let d=$('#modal');if(!d){d=document.createElement('dialog');d.id='modal';document.body.appendChild(d)}if(d.open)d.close();d.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button data-action="close-modal" aria-label="关闭对话框">关闭 ×</button></div>${body}`;d.showModal();}
 function sourceBody(keys){return keys.map(key=>{const r=REFERENCES[key];return `<div class="source-detail"><h3><a href="${r.url}" target="_blank" rel="noopener">${r.title} ↗</a></h3><p>${r.note}</p></div>`}).join('')}
 function overview(){modal('课程导航',`<div class="overview-grid">${SLIDES.map((s,i)=>`<button data-goto="${i}" class="${current===i?'current':''}"><b>${String(i+1).padStart(2,'0')}</b><span>${s.title}<small>${s.appendix?'延伸阅读':s.chapter}</small></span></button>`).join('')}</div>`)}
 function goto(i){window.CaseViewer?.close(false);current=Math.min(SLIDES.length-1,Math.max(0,i));$$('.slide').forEach((el,j)=>el.classList.toggle('active',j===current));$('#slide-count').textContent=`${current+1} / ${SLIDES.length}`;$('#prev').disabled=current===0;$('#next').disabled=current===SLIDES.length-1;$$('#chapter-track button').forEach((b,j)=>{b.classList.toggle('current',j===current);b.classList.toggle('done',j<current)});try{history.replaceState(null,'',`#${SLIDES[current].id}`)}catch{}document.title=`${String(current+1).padStart(2,'0')} · ${SLIDES[current].title} | AI4S`;}

 function renderDeck(){document.body.innerHTML=`<main id="viewport"><div id="stage-wrap"><div id="stage" aria-label="AI4S 交互课件">${SLIDES.map((s,i)=>`<section class="slide ${s.type||''}" data-slide="${i}" aria-label="${i+1}. ${s.title}"><header class="slide-header"><div class="eyebrow">${s.chapter}</div><h2 class="slide-title">${s.title}</h2></header><div class="slide-body">${s.body}</div><footer class="slide-footer"><div class="sources">${s.refs.map(r=>`<button data-source="${r}" title="查看来源">${REFERENCES[r].short}</button>`).join('')}</div><span class="footer-brand">BUPT / AI FOR SCIENCE</span><span class="page-index">${String(i+1).padStart(2,'0')}</span></footer><div class="slide-progress" style="width:${(i+1)/mainCount*100}%"></div></section>`).join('')}</div></div></main><nav id="toolbar" aria-label="演示控制"><div class="group"><span class="brand">BUPT / AI4S</span><button data-action="overview">目录 G</button><button id="prev" data-action="prev" aria-label="上一页">←</button><span id="slide-count"></span><button id="next" data-action="next" aria-label="下一页">→</button></div><div id="chapter-track">${SLIDES.slice(0,mainCount).map((s,i)=>`<button data-goto="${i}" title="${i+1}. ${s.title}" aria-label="跳到第 ${i+1} 页"></button>`).join('')}</div><div class="group"><button data-action="fullscreen">全屏 F</button><button data-action="help">帮助 ?</button></div></nav><div id="toast" role="status"></div>`;
  $$('[data-art]').forEach(el=>el.innerHTML=art(el.dataset.art));$$('[data-refs-list]').forEach(el=>{el.innerHTML=el.dataset.refsList.split(',').map((k,i)=>{const r=REFERENCES[k];return `<div class="reference-entry"><span>${String(i+1).padStart(2,'0')}</span><div><a href="${r.url}" target="_blank" rel="noopener">${r.title} ↗</a><p>${r.note}</p></div></div>`}).join('')});
  renderKepler();renderMaterials();['question','hypothesis','data','test'].forEach(k=>$('#ws-'+k).value=read('ai4s-ws-'+k,''));resize();goto(current);
 }
 let kState={kind:'cubic',noise:0,trained:false,revealed:false,result:null};
 function axes({xTicks,yTicks,xMap,yMap,xLabel,yLabel}){return `<defs><clipPath id="plot-clip"><rect x="80" y="30" width="805" height="275"/></clipPath></defs><text x="82" y="21" fill="${C.muted}" font-size="18">${yLabel}</text>${xTicks.map(([x,label])=>`<line x1="${xMap(x)}" y1="30" x2="${xMap(x)}" y2="305" stroke="${C.line}" stroke-dasharray="3 6"/><text x="${xMap(x)}" y="333" text-anchor="middle" fill="${C.muted}" font-size="17">${label}</text>`).join('')}${yTicks.map(([y,label])=>`<line x1="80" y1="${yMap(y)}" x2="885" y2="${yMap(y)}" stroke="${C.line}" stroke-dasharray="3 6"/><text x="68" y="${yMap(y)+6}" text-anchor="end" fill="${C.muted}" font-size="17">${label}</text>`).join('')}<path d="M80 30V305H885" stroke="#54718a" fill="none"/><text x="885" y="369" text-anchor="end" fill="${C.muted}" font-size="18">${xLabel}</text>`}
 function keplerPlot(){const xMap=x=>80+(Math.log10(x)+.55)/2.15*805,yMap=y=>305-(Math.log10(y)+.8)/3.6*275;let content=axes({xTicks:[[.4,'.4'],[1,'1'],[3,'3'],[10,'10'],[30,'30']],yTicks:[[.2,'.2'],[1,'1'],[10,'10'],[100,'100']],xMap,yMap,xLabel:'轨道尺度 a / AU（对数刻度）',yLabel:'公转周期 T / 年（对数刻度）'});let curve='';if(kState.trained){let lift=true;for(let i=0;i<=240;i++){const x=10**(-.55+i/240*2.15),y=kState.result.predict(x);if(y<=0||!Number.isFinite(y)){lift=true;continue}curve+=`${lift?'M':'L'}${xMap(x).toFixed(2)},${yMap(y).toFixed(2)}`;lift=false;}content+=`<path d="${curve}" fill="none" stroke="${C.teal}" stroke-width="3" clip-path="url(#plot-clip)"/>`;}
  const train=kState.trained?kState.result.train:AI4S.planets.slice(0,4);const points=[...train,...(kState.revealed?AI4S.planets.slice(4):[])];content+=points.map((p,i)=>`<circle cx="${xMap(p.x)}" cy="${yMap(p.y)}" r="6.5" fill="${i<4?C.blue:C.amber}"/><text x="${xMap(p.x)+(i===7?-8:10)}" y="${yMap(p.y)-(i%2?15:12)}" text-anchor="${i===7?'end':'start'}" fill="${i<4?C.blue:C.amber}" font-size="19">${p.name}</text>`).join('');if(!kState.revealed)content+=`<text x="535" y="87" fill="${C.muted}" font-size="23">外侧行星暂不展示</text><text x="535" y="119" fill="${C.muted}" font-size="18">先做预测，再用留出数据检验</text>`;return svg(content,'0 0 930 382');
 }
 function formula(r){if(r.kind==='power')return `T = ${fmt(r.params[0],3)} · a<sup>${fmt(r.params[1],3)}</sup>`;if(r.kind==='linear')return `T = ${fmt(r.params[1],3)} a ${r.params[0]<0?'−':'+'} ${fmt(Math.abs(r.params[0]),3)}`;return 'T = c₀ + c₁a + c₂a² + c₃a³';}
 function renderKepler(){const el=$('#kepler-lab');if(!el)return;const r=kState.result;el.innerHTML=`<div class="lab-layout"><div class="plot-panel"><div class="plot-title"><span>轨道尺度与公转周期</span><small>NASA · 8 行星参数</small></div><div class="plot">${keplerPlot()}</div><div class="plot-legend"><span><i class="swatch"></i>训练数据</span><span><i class="swatch amber"></i>留出数据</span><span><i class="swatch teal"></i>模型预测</span></div><div class="plot-footer">NASA 汇编参数；两轴对数显示。限定函数族拟合，不是开放式符号发现。<br>非正预测不绘入对数图；误差仍按原始预测计算。单位换算见“数据”。</div></div><div class="lab-controls"><label>选择候选模型<select id="k-kind"><option value="cubic" ${kState.kind==='cubic'?'selected':''}>三次多项式 · 4 参数</option><option value="power" ${kState.kind==='power'?'selected':''}>幂律 · 2 参数</option><option value="linear" ${kState.kind==='linear'?'selected':''}>直线 · 2 参数</option></select></label><div class="control-row"><button class="primary" data-action="k-train">1 · 训练模型</button><button class="secondary" data-action="k-reveal" ${!kState.trained?'disabled':''}>2 · 留出验证</button></div><div class="result-box"><label>当前拟合</label><div class="value">${r&&kState.trained?formula(r):'等待训练'}</div><div class="metric-line"><span>训练 MAPE</span><b>${kState.trained?fmt(r.trainError,3)+'%':'—'}</b></div><div class="metric-line"><span>留出 MAPE</span><b>${kState.revealed?fmt(r.testError)+'%':'待揭示'}</b></div></div><label>人为训练扰动：±${Math.round(kState.noise*100)}%<input aria-label="训练数据人为扰动" id="k-noise" type="range" min="0" max="20" step="1" value="${Math.round(kState.noise*100)}"></label><div class="control-row"><button data-action="k-data">数据</button><button data-action="k-export">导出</button><button data-action="k-reset">重置</button></div><p class="micro" style="font-size:17px">切换模型或扰动后，请重新训练。</p></div></div><div class="lab-status" aria-live="polite">${!kState.trained?'先猜：训练集拟合最好，是否也会在外侧行星表现最好？':!kState.revealed?'模型已拟合。请先作外推判断，再揭示验证结果。':'已揭示验证：用新范围的证据，检查候选规律的适用边界。'}</div>`;}
 let run=AI4S.newRun(24),kappa=1.6,truthVisible=false;
 function materialsPlot(){const pred=AI4S.gp(run.ai),xm=x=>80+x*805,ym=y=>305-(y+.12)/1.38*275;let content=axes({xTicks:[[0,'0'],[.25,'.25'],[.5,'.50'],[.75,'.75'],[1,'1']],yTicks:[[0,'0'],[.25,'25'],[.5,'50'],[.75,'75'],[1,'100']],xMap:xm,yMap:ym,xLabel:'配方比例 x（无量纲）',yLabel:'材料性能（任意单位）'});const grid=Array.from({length:151},(_,i)=>i/150),dist=grid.map(x=>({x,...pred(x)}));const line=dist.map((p,i)=>`${i?'L':'M'}${xm(p.x)},${ym(p.mean)}`).join(' '),upper=dist.map(p=>`${xm(p.x)},${ym(p.mean+1.96*p.sd)}`),lower=[...dist].reverse().map(p=>`${xm(p.x)},${ym(p.mean-1.96*p.sd)}`);content+=`<g clip-path="url(#plot-clip-m)"><polygon points="${[...upper,...lower].join(' ')}" fill="${C.blue}" opacity=".15"/><path d="${line}" stroke="${C.blue}" stroke-width="3" fill="none"/>`;
  if(truthVisible)content+=`<polyline points="${grid.map(x=>`${xm(x)},${ym(AI4S.materialTruth(x,run.seed))}`).join(' ')}" stroke="#a4b6c4" stroke-dasharray="7 7" stroke-width="2" fill="none"/>`;
  content+=run.random.filter(p=>!p.initial).map(p=>`<path d="M${xm(p.x)-5} ${ym(p.y)-5}l10 10m0 -10l-10 10" stroke="${C.amber}" stroke-width="2.5"/>`).join('');content+=run.ai.map((p,i)=>`<circle cx="${xm(p.x)}" cy="${ym(p.y)}" r="${p.initial?6:7}" fill="${C.teal}" stroke="#092230" stroke-width="2"/>${!p.initial&&i===run.ai.length-1?`<text x="${xm(p.x)+(p.x>.85?-12:12)}" y="${ym(p.y)-14}" text-anchor="${p.x>.85?'end':'start'}" fill="${C.teal}" font-size="17">第 ${i-2} 轮</text>`:''}`).join('');if(run.pending)content+=`<line x1="${xm(run.pending.x)}" y1="30" x2="${xm(run.pending.x)}" y2="305" stroke="${C.teal}" stroke-dasharray="5 5"/><circle cx="${xm(run.pending.x)}" cy="${ym(run.pending.mean)}" r="11" stroke="${C.teal}" stroke-width="2" fill="none"/>`;content+='</g>';return svg(content.replaceAll('plot-clip','plot-clip-m'),'0 0 930 382').replace('plot-clip-m-m','plot-clip-m');
 }
 function renderMaterials(){const el=$('#materials-lab');if(!el)return;const best=Math.max(...run.ai.map(p=>p.y)),rb=Math.max(...run.random.map(p=>p.y));el.innerHTML=`<div class="lab-layout"><div class="plot-panel"><div class="plot-title"><span>预测 → 测量 → 更新</span><small>${run.ai.length} 次测量 / 每组 · 种子 ${run.seed}</small></div><div class="plot">${materialsPlot()}</div><div class="plot-legend"><span><i class="swatch"></i>GP 均值与约 95% 模型区间</span><span><i class="swatch teal"></i>已测点 · 标注最新轮次</span><span><i class="swatch amber"></i>随机基线 ×</span></div><div class="plot-footer">虚拟材料模型；新增测量无随机噪声。模型区间来自固定超参数与噪声假设。<br>${truthVisible?'灰虚线为完整响应曲线；比较预测与曲线，分析哪些区域仍有偏差。':'虚拟真值暂隐藏。GP-UCB 只使用已测点，不读取隐藏曲线。'}</div></div><div class="lab-controls"><div class="result-box"><label>已完成 ${run.round} / 12 轮新增实验</label><div class="metric-line"><span>当前最佳性能</span><b>${fmt(best*100,1)}</b></div><div class="metric-line"><span>随机基线最佳</span><b style="color:var(--amber)">${fmt(rb*100,1)}</b></div><p>${run.round>=12?'实验次数已达上限，可比较结果或重置。':run.pending?`建议 x = <b>${fmt(run.pending.x)}</b><br>预测 ${fmt(run.pending.mean*100,1)} ± ${fmt(run.pending.sd*196,1)}`:'获取模型建议，或输入你想测试的配方。'}</p></div><div class="control-row"><button class="secondary" data-action="m-suggest" ${run.round>=12?'disabled':''}>建议下一实验</button><button class="primary" data-action="m-measure" ${!run.pending||run.round>=12?'disabled':''}>运行虚拟实验</button></div><label>探索权重 κ = ${fmt(kappa,1)}<input id="m-kappa" aria-label="探索权重" type="range" min="0" max="3" step=".1" value="${kappa}"></label><div class="manual-line"><span>手选 x</span><input id="m-manual" type="number" min=".01" max=".99" step=".01" value=".7" aria-label="手选配方比例"><button data-action="m-manual" ${run.round>=12?'disabled':''}>测量</button></div><div class="control-row"><button data-action="m-truth">${truthVisible?'隐藏':'揭示'}真值</button><button data-action="m-export">导出</button><button data-action="m-reset">重置</button></div><p class="micro">选点分数 = 均值 + κ × 标准差<br>更大的 κ 更偏好不确定区域。</p></div></div><div class="lab-status" aria-live="polite">${run.round>=12?'两组均已完成 12 轮新增实验（各 15 次测量）。比较最佳结果，或点击“重置”重新开始。':run.pending?'建议已经给出，但结果尚未知。点击“运行虚拟实验”才能获得新证据。':run.log.length?`第 ${run.round} 轮反馈：x = ${fmt(run.log.at(-1).x)}，实际性能 ${fmt(run.log.at(-1).observed*100,1)}。模型已更新。`:''}</div>`;}
 function modelRecord(){return {description:'NASA planetary fact-sheet regression teaching run',source:REFERENCES.nasa.url,units:{x:'AU',y:'Julian year'},kind:kState.kind,trainingPerturbation:kState.noise,seed:22,split:'inner four train; outer four held out',parameters:kState.result?.params,trainMAPE:kState.result?.trainError,testMAPE:kState.revealed?kState.result?.testError:null,rawData:AI4S.planets,trainingData:kState.result?.train,time:new Date().toISOString()};}
 function dataDialog(){modal('NASA 行星参数 · 原始与换算值',`<p>日距采用事实表的近似轨道尺度。月球与冥王星未纳入本例。</p><table style="width:100%;font-size:17px;line-height:2;margin-top:20px;text-align:right"><thead><tr><th>行星</th><th>日距 / 百万 km</th><th>周期 / 天</th><th>a / AU</th><th>T / 年</th><th>用途</th></tr></thead><tbody>${AI4S.planets.map((p,i)=>`<tr><td>${p.name}</td><td>${p.distanceMillionKm}</td><td>${p.periodDays}</td><td>${fmt(p.x,4)}</td><td>${fmt(p.y,4)}</td><td>${i<4?'训练':'留出'}</td></tr>`).join('')}</tbody></table><p style="margin-top:15px"><a target="_blank" rel="noopener" href="${REFERENCES.nasa.url}">数据来源 ↗</a> · 1 AU = 149.5978707 百万 km；1 儒略年 = 365.25 天。</p>`);}
 function action(a){switch(a){
  case 'prev':goto(current-1);break;case 'next':goto(current+1);break;case 'overview':overview();break;case 'close-modal':$('#modal')?.close();break;
  case 'fullscreen':if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>toast('可使用浏览器菜单进入全屏'));break;

  case 'k-train':kState.result=AI4S.fitPlanets(kState.kind,kState.noise);kState.trained=true;kState.revealed=false;renderKepler();break;

  case 'k-data':dataDialog();break;case 'k-export':download('AI4S-行星回归记录.json',JSON.stringify(modelRecord(),null,2));toast('已下载当前实验记录');break;
  case 'm-suggest':run.pending=AI4S.suggest(run,kappa);renderMaterials();break;

  case 'm-manual':{const x=Number($('#m-manual').value);if(!Number.isFinite(x)||x<.01||x>.99){toast('请输入 0.01–0.99 之间的比例');break;}try{AI4S.step(run,kappa,x);renderMaterials();}catch(e){toast(e.message)}break;}
  case 'm-truth':truthVisible=!truthVisible;renderMaterials();break;

  case 'benchmark':{const runs=[0,1.6,2.4].map(k=>AI4S.benchmark(60,k));$('#benchmark-output').innerHTML=`<div class="eyebrow">每种 κ · 60 次即时计算</div><h3 style="margin:20px 0">探索强度会改变结果</h3><table class="benchmark-table"><thead><tr><th>κ</th><th>GP 平均最佳</th><th>胜 / 平 / 负</th></tr></thead><tbody>${runs.map(r=>`<tr><td>${fmt(r.kappa,1)}</td><td>${fmt(r.meanAI*100,2)}</td><td>${r.wins} / ${r.ties} / ${r.losses}</td></tr>`).join('')}</tbody></table><p style="font-size:23px;margin-top:20px">同预算随机基线平均最佳：<b style="color:var(--amber)">${fmt(runs[0].meanRandom*100,2)}</b></p><p class="micro" style="margin-top:18px">任意性能单位；每组 3+9 次测量。<br>结果来自同一组虚拟材料响应函数。</p><button data-action="benchmark-export" style="margin-top:15px">导出全部 180 次运行</button>`;break;}
  case 'benchmark-export':{const records=[];for(const k of [0,1.6,2.4])for(let i=1;i<=60;i++){const r=AI4S.newRun(i);for(let j=0;j<9;j++)AI4S.step(r,k);records.push({kappa:k,...r})}download('AI4S-参数对照.json',JSON.stringify({summary:[0,1.6,2.4].map(k=>AI4S.benchmark(60,k)),records},null,2));break;}
  case 'export-worksheet':{const labels=['科学问题','可证伪假设','数据与比较基线','证伪与验证标准'];const text=['# AI4S 第一讲研究草案','',...['question','hypothesis','data','test'].flatMap((k,i)=>[`## ${labels[i]}`,$('#ws-'+k).value||'（尚未填写）','']),'仅保存到本机；正式提交方式以课程组通知为准。'].join('\n');download('AI4S-研究草案.md',text,'text/markdown;charset=utf-8');toast('研究草案已下载到本机');break;}
