name: Validate papers and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install paper build dependencies
        run: python -m pip install -r tools/papers-requirements.txt
      - name: Validate papers and generate index
        run: python tools/build_paper_index.py --site
      - name: Test catalog and collector
        run: |
          node --test tests/papers.test.mjs tests/replay.test.mjs
          python -m unittest discover -s tests -p test_paper_index.py
          python -m unittest discover -s tests -p test_paper_markdown.py
          python -m unittest discover -s tests -p test_openreview.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
