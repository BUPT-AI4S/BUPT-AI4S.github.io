name: Validate papers and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每小时两次的部署会互相抢占，且每次都完整 checkout 几百 MB 的爬虫仓库。
    # 每 6 小时兜底刷新一次即可，数据变更主要由爬虫推送的 commit 触发。
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 构建是可丢弃的：新提交可以抢占旧构建，省掉重复的几分钟。
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Checkout crawler data
        uses: actions/checkout@v6
        with:
          repository: BUPT-AI4S/ai4s-crawler
          path: .crawler-source
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /metadata/*/snapshot.json
            /metadata/*/ai4s.json
            /reviews/venue-review.csv
            /reviews/source-assignments-*.json
            /reviews/*/*.json
            /reviews/*/*/coverage.json
            /reviews/*/*/coverage.csv
            /reviews/*/*/conference-crawl-check.csv
            /reviews/*/feedback/*.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install paper build dependencies
        run: python -m pip install -r tools/papers-requirements.txt
      - name: Generate review monitor snapshot
        run: python tools/build_review_monitor.py --source .crawler-source
      - name: Validate papers and generate index
        run: python tools/build_paper_index.py --site
      - name: Test catalog and collector
        run: |
          node --test tests/review-monitor-live.test.mjs tests/papers.test.mjs tests/pdf-reader.test.mjs tests/replay.test.mjs tests/replay-metrics.test.mjs tests/blog.test.mjs tests/blog-chapters.test.mjs tests/blog-search.test.mjs tests/news.test.mjs
          python -m unittest discover -s tests -p test_review_monitor.py
          python -m unittest discover -s tests -p test_blog_import.py
          python -m unittest discover -s tests -p test_news_import.py
          python -m unittest discover -s tests -p test_paper_index.py
          python -m unittest discover -s tests -p test_paper_markdown.py
          python -m unittest discover -s tests -p test_paper_tags.py
          python -m unittest discover -s tests -p test_clean_ai4s_metadata.py
          python -m unittest discover -s tests -p test_imported_catalog.py
          python -m unittest discover -s tests -p test_metadata_update.py
          python -m unittest discover -s tests -p test_openreview.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # GitHub Pages 同一时刻只允许一个部署。这里排队等待、绝不取消：
    # 被中途打断的部署会在 Pages 服务端留下永远 "in progress" 的锁，
    # 之后所有部署都会被 400 拒绝（Failed to create deployment ... in progress deployment）。
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy website (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 120
      - name: Deploy website (final retry)
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
